<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOONIYA BOMMA</title>


<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ffd1dc, #fff);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", sans-serif;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        text-align: center;
        width: 90%;
        max-width: 350px;
    }

    h1 {
        color: #e91e63;
        margin-bottom: 10px;
    }

    p {
        color: #555;
        margin-bottom: 25px;
        font-size: 18px;
    }

    .buttons {
        position: relative;
        height: 120px;
    }

    button {
        padding: 12px 25px;
        font-size: 16px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yesBtn {
        background: #e91e63;
        color: white;
    }

    #yesBtn:hover {
        background: #d81b60;
        transform: scale(1.05);
    }

    #noBtn {
        background: #f8bbd0;
        color: #880e4f;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }

    .result {
        display: none;
        margin-top: 20px;
    }

    .meme {
        font-size: 26px;
        margin-top: 10px;
    }

    .heart {
        font-size: 50px;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }
</style>
</head>

<body>

<div class="card" id="card">
    <h1>Hey kalai</h1>
    <p>Naan thana un crush uh???😂</p>

    <div class="buttons">
        <button id="yesBtn">Amaaa😭</button>
        <button id="noBtn">Nooo😠</button>
    </div>

    <div class="result" id="result">
        <div class="heart">ama vah!🕺🏼😂</div>
        <div class="meme"> seri side chick ah veychukuran😌🤣🤣</div>
    </div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");

    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * 200 - 100;
        const y = Math.random() * 80 - 40;

        noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    yesBtn.addEventListener("click", () => {
        result.style.display = "block";
        document.querySelector(".buttons").style.display = "none";
    });
</script>

</body>
</html>
